<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>链接不可用</title>
<style>
:root{--bg:#0e1116;--fg:#e9ecf2;--muted:#98a2b3}
@media (prefers-color-scheme:light){:root{--bg:#f4f6f9;--fg:#12161c;--muted:#667085}}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--fg);
font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;text-align:center;padding:24px}
.code{font-size:52px;font-weight:600;letter-spacing:2px;margin:0;opacity:.35}
h1{font-size:16px;font-weight:500;margin:14px 0 8px}
p{font-size:13px;color:var(--muted);margin:0}
</style>
</head>
<body>
<div>
  <p class="code">404</p>
  <h1>链接不可用</h1>
  <p>该二维码对应的内容不存在或已停止访问</p>
</div>
</body>
</html>
